name = "Klon"
grammar = "klon"
path_suffixes = ["klon", "glas.pack", "klar.build", "klar.fmt", "klar.lint"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = '"', end = '"', close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = '>"', end = '"', close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = ">'", end = "'", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "/*", end = " */", close = true, newline = false },
]
